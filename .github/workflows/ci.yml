name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. On main every merge keeps its own run,
  # so each merged commit has a result (opencode does the same for its default branch).
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # The version in package.json "packageManager", the same on CI and every machine.
          bun-version-file: package.json
      # Bun's download cache, keyed on the lockfile; bun install then only links.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Types do not depend on the OS: checked once.
      - if: runner.os == 'Linux'
        run: bun run typecheck
      # Files run in parallel worker processes, each file in a fresh global (implies --isolate),
      # so one file's leftover state cannot reach the next. With every CPU busy, a test that
      # spawns processes passed the default 5 s on the Windows runner: 20 s each here; a real
      # hang still ends at the job's timeout.
      - run: bun test --parallel --timeout=20000

  build:
    # The standalone binary (scripts/build.ts) on Linux for every pull request; the script itself
    # runs --version and --self-check (bundled skills/agents/prompts, OpenTUI native, tree-sitter).
    # The other platforms, the installers and the npm packages are in package.yml, which runs
    # when a pull request touches them and on every push to main.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # The version in package.json "packageManager", the same on CI and every machine.
          bun-version-file: package.json
      # Bun's download cache, keyed on the lockfile; bun install then only links.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build --single

  secrets:
    # Scan every commit, not just the checked-out tree: a key removed later is still public
    # in history. Fake keys in tests carry a `gitleaks:allow` comment; known fakes in old
    # commits are listed in .gitleaksignore.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --log-opts="--all" --redact --no-banner
