version: 2
updates:
  # The app is TypeScript on Bun (bun.lock); the old pip entry pointed at nothing.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Every @ai-sdk/* package pins its own @ai-sdk/provider; bumping one alone
      # leaves `ai` on an older provider and breaks typecheck (#188-#190).
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
          - "@openrouter/ai-sdk-provider"
      # @opentui/solid pins an exact @opentui/core; bumping core alone splits
      # KeyEvent and renderable types into two copies (#193).
      opentui:
        patterns:
          - "@opentui/*"
    ignore:
      # @opentui/solid declares solid-js ^1.9 (0.9.7 still does): Solid 2 removes
      # solid-js/store, createResource, onMount and the JSX namespace it needs (#405).
      # Lift this once @opentui/solid supports Solid 2.
      - dependency-name: "solid-js"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
