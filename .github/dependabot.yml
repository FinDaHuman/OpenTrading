version: 2
updates:
  # The app is TypeScript on Bun (bun.lock); the old pip entry pointed at nothing.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Every @ai-sdk/* package pins its own @ai-sdk/provider; bumping one alone
      # leaves `ai` on an older provider and breaks typecheck (#188-#190).
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
          - "@openrouter/ai-sdk-provider"
      # @opentui/solid pins an exact @opentui/core; bumping core alone splits
      # KeyEvent and renderable types into two copies (#193).
      opentui:
        patterns:
          - "@opentui/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
