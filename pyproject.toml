[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "opentrading"
dynamic = ["version"]
description = "Local-first LLM harness scaffold for Vietnamese market research"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "DongAnh Capital" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "rich>=13.9,<15",
  "textual>=1.0,<2",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<3",
  "pre-commit>=4.0,<5",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6.0,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
opentrading = "opentrading.interfaces.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opentrading"]

[tool.hatch.version]
path = "src/opentrading/__init__.py"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["opentrading"]
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["opentrading"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
