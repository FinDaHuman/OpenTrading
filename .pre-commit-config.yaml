repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: documentation-links
        name: Check documentation links
        entry: python scripts/check_docs.py
        language: system
        pass_filenames: false
      - id: secret-patterns
        name: Check high-confidence secret patterns
        entry: python scripts/check_secrets.py
        language: system
        pass_filenames: false
